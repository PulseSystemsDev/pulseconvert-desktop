appId: dev.pulsesystems.convertdesktop
productName: Pulse Convert Desktop
copyright: "Copyright (c) 2026 Pulse Systems"

directories:
  output: release
  buildResources: assets

files:
  - dist/**
  - renderer/**
  - "!**/*.map"

extraResources:
  - from: resources/
    to: resources/

publish:
  provider: github
  owner: YesYesTheDev
  repo: pulseconvert-desktop

win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.ico
  artifactName: "PulseConvertDesktop-Setup-${version}.exe"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Pulse Convert Desktop
  deleteAppDataOnUninstall: false

compression: maximum
generateUpdatesFilesForAllChannels: true
